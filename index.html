<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoolSpinningWheel</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#100b2c,#24105a,#071b40);
  color: white;
  font-family: Arial,sans-serif;
  text-align: center;
  padding: 25px 12px;
}
h1 { font-size: 32px; }
#currentName {
  font-size: 36px;
  font-weight: bold;
  color: #ffd65a;
  margin: 18px 0;
  min-height: 44px;
}
.wheel-container {
  position: relative;
  width: min(88vw,430px);
  margin: 20px auto;
}
canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 30px #8c55ff;
}
.pointer {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 19px solid transparent;
  border-right: 19px solid transparent;
  border-top: 38px solid #ffcf36;
  z-index: 2;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 6px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  background: #7545e8;
}
input {
  padding: 13px;
  border-radius: 10px;
  border: 0;
  font-size: 16px;
  width: 65%;
  max-width: 250px;
}
#names {
  margin: 20px auto;
  max-width: 350px;
  line-height: 2;
  font-size: 20px;
}
</style>
</head>
<body>

<h1>CoolSpinningWheel</h1>
<div id="currentName">David</div>

<div class="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel" width="600" height="600"></canvas>
</div>

<button onclick="spin()">DREHEN</button>
<br>
<input id="nameInput" placeholder="Name eingeben">
<button onclick="addName()">Hinzufügen</button>
<br>
<button onclick="removeWinner()">Gewinner entfernen</button>
<button onclick="clearNames()">Alle löschen</button>
<div id="names"></div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let names = ["David", "Alex", "Max", "Leon", "Tom"];
let rotation = 0;
let spinning = false;

const colors = ["#6545e8", "#2778e8", "#e5a52e", "#a43fe0", "#16a6a0"];

function normalize(angle) {
  return ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
}

function pointedIndex() {
  if (!names.length) return -1;
  const slice = Math.PI * 2 / names.length;
  return Math.floor(normalize(-rotation) / slice);
}

function draw() {
  ctx.clearRect(0, 0, 600, 600);

  if (!names.length) {
    ctx.fillStyle = "white";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Keine Namen", 300, 310);
    document.getElementById("currentName").textContent = "–";
    updateList();
    return;
  }

  const slice = Math.PI * 2 / names.length;

  names.forEach((name, i) => {
    const start = rotation + i * slice - Math.PI / 2;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(300, 300);
    ctx.arc(300, 300, 285, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(300, 300);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "white";
    ctx.font = "bold 35px Arial";
    ctx.shadowColor = "#000";
    ctx.shadowBlur = 4;
    ctx.fillText(name,130,0);
    ctx.restore();
  });

  document.getElementById("currentName").textContent =
    names[pointedIndex()];
  updateList();
}

function updateList() {
  document.getElementById("names").innerHTML =
    names.map((name, i) => `${i + 1}. ${name}`).join("<br>");
}

function spin() {
  if (spinning || names.length < 2) return;
  spinning = true;

  const startRotation = rotation;
  const extra = Math.PI * 2 * (5 + Math.random() * 5);
  const target = startRotation + extra + Math.random() * Math.PI * 2;
  const duration = 5000;
  const startTime = performance.now();

  function animate(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4);
    rotation = startRotation + (target - startRotation) * eased;
    draw();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      draw();
      confetti();
    }
  }
  requestAnimationFrame(animate);
}

function addName() {
  const input = document.getElementById("nameInput");
  const name = input.value.trim();
  if (!name) return;
  names.push(name);
  input.value = "";
  draw();
}

function removeWinner() {
  if (!names.length || spinning) return;
  const index = pointedIndex();
  names.splice(index, 1);
  rotation = 0;
  draw();
}

function clearNames() {
  if (spinning) return;
  names = [];
  rotation = 0;
  draw();
}

function confetti() {
  const pieces = [];
  for (let i = 0; i < 100; i++) {
    pieces.push({
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * 300,
      speed: 2 + Math.random() * 5,
      size: 5 + Math.random() * 7,
      color: colors[i % colors.length]
    });
  }

  const overlay = document.createElement("canvas");
  overlay.style.cssText =
    "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";
  overlay.width = window.innerWidth;
  overlay.height = window.innerHeight;
  document.body.appendChild(overlay);
  const c = overlay.getContext("2d");
  let frames = 0;

  function animateConfetti() {
    c.clearRect(0, 0, overlay.width, overlay.height);
    pieces.forEach(p => {
      p.y += p.speed;
      c.fillStyle = p.color;
      c.fillRect(p.x, p.y, p.size, p.size);
    });
    frames++;
    if (frames < 100) requestAnimationFrame(animateConfetti);
    else overlay.remove();
  }
  animateConfetti();
}

draw();
</script>
</body>
</html>
