<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoolSpinningWheel</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;text-align:center;background:radial-gradient(circle at top,#24204d,#090914 70%)}
header{padding:28px 12px 12px}
h1{font-size:clamp(2rem,8vw,3.5rem);margin:0;color:#b98cff;text-shadow:0 0 18px #8b45ff}
header p{color:#aaa}
main{width:min(650px,94%);margin:20px auto}
.card{background:#17172a;border:1px solid #39345c;border-radius:20px;padding:20px;box-shadow:0 0 25px #5d36a533}
#winner{min-height:42px;font-size:25px;font-weight:bold;color:#ffd66b;margin-bottom:12px}
.wheel-area{position:relative;width:min(85vw,420px);margin:auto}
#wheel{width:100%;height:auto;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #ffd34e;z-index:2}
button,input{border:0;border-radius:12px;padding:13px;font-size:16px}
button{cursor:pointer;font-weight:bold}
.primary{background:linear-gradient(135deg,#8c4dff,#347cff);color:white}
.secondary{background:#30304c;color:white}
.danger{background:#51263b;color:#ffb6c9}
button:disabled{opacity:.5}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
input{width:65%;background:#292940;color:white;border:1px solid #555}
#names{color:#ccc;line-height:1.8;margin-top:15px}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header>
<h1>CoolSpinningWheel</h1>
<p>Wer wird gewinnen?</p>
</header>
<main>
<div class="card">
<div id="winner">Bereit zum Drehen?</div>
<div class="wheel-area">
<div class="pointer"></div>
<canvas id="wheel" width="600" height="600"></canvas>
</div>
<div class="controls">
<button class="primary" id="spin">DREHEN</button>
<button class="danger" id="remove" disabled>Gewinner entfernen</button>
</div>
<div class="controls">
<input id="nameInput" placeholder="Name eingeben">
<button class="primary" id="add">Hinzufügen</button>
</div>
<div class="controls">
<button class="secondary" id="clear">Alle Namen löschen</button>
</div>
<div id="names"></div>
</div>
</main>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const winnerText=document.getElementById("winner");
const spinBtn=document.getElementById("spin");
const removeBtn=document.getElementById("remove");
const input=document.getElementById("nameInput");
const namesBox=document.getElementById("names");

let names=["David","Alex","Max","Leon","Tom"];
let angle=0,spinning=false,winnerIndex=-1;
const colors=["#874cff","#287cff","#e8b83f","#a34cff","#315de8","#d69b27","#6638c9","#287ebd"];

function draw(){
 const n=names.length;
 ctx.clearRect(0,0,600,600);
 if(!n){
  ctx.beginPath();ctx.arc(300,300,285,0,Math.PI*2);
  ctx.fillStyle="#292940";ctx.fill();
  ctx.fillStyle="white";ctx.font="28px Arial";ctx.textAlign="center";
  ctx.fillText("Namen hinzufügen",300,310);
  return;
 }
 const slice=Math.PI*2/n;
 names.forEach((name,i)=>{
  const start=angle+i*slice,end=start+slice;
  ctx.beginPath();ctx.moveTo(300,300);ctx.arc(300,300,285,start,end);
  ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();
  ctx.strokeStyle="#ffffff55";ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.translate(300,300);ctx.rotate(start+slice/2);
  ctx.textAlign="right";ctx.fillStyle="white";ctx.font="bold 22px Arial";
  ctx.fillText(name.length>16?name.slice(0,15)+"…":name,260,8);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(300,300,35,0,Math.PI*2);
 ctx.fillStyle="#ffd34e";ctx.fill();
}

function updateNames(){
 namesBox.textContent=names.length?"Namen: "+names.join(" • "):"Noch keine Namen vorhanden";
 spinBtn.disabled=names.length<2||spinning;
 removeBtn.disabled=winnerIndex<0||spinning;
 draw();
}

function addName(){
 const name=input.value.trim();
 if(!name)return;
 names.push(name);input.value="";
 winnerIndex=-1;
 winnerText.textContent="Bereit zum Drehen?";
 updateNames();
}
document.getElementById("add").onclick=addName;
input.addEventListener("keydown",e=>{if(e.key==="Enter")addName()});

document.getElementById("clear").onclick=()=>{
 if(spinning)return;
 names=[];winnerIndex=-1;
 winnerText.textContent="Füge Namen hinzu!";
 updateNames();
};

function getWinner(){
 const slice=Math.PI*2/names.length;
 let relative=(-Math.PI/2-angle)%(Math.PI*2);
 if(relative<0)relative+=Math.PI*2;
 return Math.floor(relative/slice)%names.length;
}

spinBtn.onclick=()=>{
 if(spinning||names.length<2)return;
 spinning=true;winnerIndex=-1;
 winnerText.textContent="Das Rad dreht sich...";
 updateNames();
 const start=angle;
 const target=start+Math.PI*2*(6+Math.random()*4)+Math.random()*Math.PI*2;
 const duration=5500,beginning=performance.now();

 function animate(now){
  const t=Math.min((now-beginning)/duration,1);
  angle=start+(target-start)*(1-Math.pow(1-t,4));
  draw();
  if(t<1)requestAnimationFrame(animate);
  else{
   spinning=false;
   winnerIndex=getWinner();
   winnerText.textContent="Gewinner: "+names[winnerIndex];
   updateNames();
   confetti();
  }
 }
 requestAnimationFrame(animate);
};

removeBtn.onclick=()=>{
 if(winnerIndex<0||spinning)return;
 const removed=names.splice(winnerIndex,1)[0];
 winnerIndex=-1;
 winnerText.textContent=removed+" wurde entfernt!";
 updateNames();
};

function confetti(){
 const c=document.getElementById("confetti");
 const x=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 let pieces=Array.from({length:140},()=>({
  x:Math.random()*c.width,
  y:-20-Math.random()*c.height/2,
  speed:2+Math.random()*5,
  size:4+Math.random()*7,
  color:colors[Math.floor(Math.random()*colors.length)],
  rotation:Math.random()*6
 }));
 let frames=0;
 function fall(){
  x.clearRect(0,0,c.width,c.height);
  pieces.forEach(p=>{
   p.y+=p.speed;p.rotation+=.08;
   x.save();x.translate(p.x,p.y);x.rotate(p.rotation);
   x.fillStyle=p.color;
   x.fillRect(-p.size/2,-p.size/2,p.size,p.size);
   x.restore();
  });
  if(++frames<150)requestAnimationFrame(fall);
  else x.clearRect(0,0,c.width,c.height);
 }
 fall();
}
updateNames();
</script>
</body>
</html>
